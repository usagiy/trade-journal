name: Build image

# Builds the app image with the shared reusable workflow and pushes it to GHCR
# (PRs: build only, no push). See usagiy/github-workflows.
#   main     -> ghcr.io/usagiy/trade-journal:sha-<short> (+ latest)
#   v1.2.3   -> ghcr.io/usagiy/trade-journal:1.2.3
# Tests run in ci.yml, so no test-command here.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    uses: usagiy/github-workflows/.github/workflows/docker-build.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image-name: usagiy/trade-journal
